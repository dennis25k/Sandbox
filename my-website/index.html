<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta Tags -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Genesis Web Development</title>

        <!-- Style Links -->
        <link rel="icon" href="images/tree.png" />
        <link rel="stylesheet" href="css/style.css" />

        <!-- Google Font Links -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&display=swap"
            rel="stylesheet"
        />

        <!-- Font Awesome Links -->
        <script
            src="https://kit.fontawesome.com/eca3a8dd5d.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <header>
            <a href="index.html">
                <img src="images/tree.png" alt="Genesis Web Development" />
            </a>
            <div class="icons">
                <i class="fa-brands fa-html5"></i>
                <i class="fa-brands fa-css3-alt"></i>
                <i class="fa-brands fa-js"></i>
            </div>
        </header>

        <main>
            <h1>Innovation Labs</h1>

            <section class="container">
                <h2>Front End</h2>
                <div class="group">
                    <div class="card">
                        <h3>Languages</h3>
                        <ul>
                            <li>Markdown</li>
                            <li>HTML</li>
                            <li>CSS</li>
                            <li>JavaScript</li>
                            <li>TypeScript</li>
                        </ul>
                    </div>

                    <div class="card">
                        <h3>Frameworks</h3>
                        <ul>
                            <li>Bootstrap</li>
                            <li>React</li>
                            <li>Angular</li>
                        </ul>
                    </div>

                    <div class="card">
                        <h3>Software</h3>
                        <ul>
                            <li>Git</li>
                            <li>Node Js</li>
                            <li>NPM</li>
                        </ul>
                    </div>
                </div>

                <h2>Back End</h2>
                <div class="group">
                    <div class="card">
                        <h3>Languages</h3>
                        <ul>
                            <li>Python</li>
                        </ul>
                    </div>
                </div>

                <h2>Block Chain</h2>
                <div class="group">
                    <div class="card">
                        <h3>Languages</h3>
                        <ul>
                            <li>Solidity</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>

        <footer>Footer goes here</footer>
    </body>
</html>
